name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 语法检查 + 回归测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（编译脚本与测试）
        run: python -m compileall -q scripts tests

      - name: 回归测试（纯标准库 unittest）
        run: python -m unittest discover -s tests -t . -v

      - name: 确认测试没有写出个人数据文件
        run: |
          test ! -e references/progress.json
          test ! -e references/milestones.md
          test ! -e references/local.md
